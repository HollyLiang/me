<div class="manage-container">
  <div class="category-section">
    <h2>Categories</h2>
    <form [formGroup]="categoryForm" (ngSubmit)="addCategory()">
      <mat-form-field appearance="fill">
        <mat-label>Category Name</mat-label>
        <input matInput formControlName="categoryName">
      </mat-form-field>
      <button mat-raised-button color="primary" type="submit" [disabled]="categoryForm.invalid">Add Category</button>
    </form>
    <ul>
      <li *ngFor="let category of categories()" (click)="selectCategory(category.id)"
        [class.selected]="category.id === selectedCategoryId">
        <div *ngIf="editingCategoryId !== category.id; else editTemplate">
          {{ category.name }}
          <button mat-icon-button (click)="startEditingCategory(category.id, category.name)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteCategory(category.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
        <ng-template #editTemplate>
          <input matInput [(ngModel)]="editingCategoryName" placeholder="Edit Category Name">
          <button mat-icon-button color="primary" (click)="saveCategoryEdit(category.id)">
            <mat-icon>check</mat-icon>
          </button>
          <button mat-icon-button (click)="cancelCategoryEdit()">
            <mat-icon>close</mat-icon>
          </button>
        </ng-template>
      </li>
    </ul>
  </div>

  <div class="text-section" *ngIf="selectedCategoryId">
    <h2>Texts</h2>
    <form [formGroup]="textForm" (ngSubmit)="addText()">
      <mat-form-field appearance="fill">
        <mat-label>Text (Chinese)</mat-label>
        <input matInput formControlName="text">
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>Translate (Japanese)</mat-label>
        <input matInput formControlName="translate">
      </mat-form-field>
      <button mat-raised-button color="primary" type="submit" [disabled]="textForm.invalid">Add Text</button>
    </form>
    <ul>
      <li *ngFor="let text of texts()">
        <div *ngIf="editingTextId !== text.id; else editTextTemplate">
          {{ text.text }} ({{ text.translate || 'No Translation' }})
          <button mat-icon-button (click)="startEditingText(text.id, text.text, text.translate)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteText(text.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
        <ng-template #editTextTemplate>
          <input matInput [(ngModel)]="editingText" placeholder="Edit Text">
          <input matInput [(ngModel)]="editingTranslate" placeholder="Edit Translation">
          <button mat-icon-button color="primary" (click)="saveTextEdit(text.id)">
            <mat-icon>check</mat-icon>
          </button>
          <button mat-icon-button (click)="cancelTextEdit()">
            <mat-icon>close</mat-icon>
          </button>
        </ng-template>
      </li>
    </ul>
  </div>
</div>
