<form [formGroup]="signInForm" (ngSubmit)="onFormSubmit()" #form="ngForm" class="content">
  <h1 class="header">Login</h1>

  <section>
    <mat-form-field class="col-12">
      <input matInput required placeholder="Account" formControlName="account">
      <mat-error>
        <app-form-error [control]="signInForm.controls.account">
        </app-form-error>
      </mat-error>
    </mat-form-field>
  </section>
  <section>
    <mat-form-field class="col-12">
      <input matInput type="password" required placeholder="Password" formControlName="password">
      <mat-error>
        <app-form-error [control]="signInForm.controls.password">
        </app-form-error>
      </mat-error>
    </mat-form-field>
  </section>
  <!--
  <section class="col-12">
    <mat-slide-toggle class="example-margin" color="primary" formControlName="rememberMe">
      Remember me
    </mat-slide-toggle>
  </section> -->

  <section class="col-12">
    <mat-error *ngIf="errorMsg">
      <strong>Account or Password incorrect</strong>
    </mat-error>
  </section>

  <section class="col-10 offset-1 margin-top-2x">
    <button mat-raised-button color="primary" class="col-12" type="submit">SIGN IN</button>
  </section>

  <!-- <section class="padding-top-4x d-flex align-items-center justify-content-center flex-direct-col">
      <mat-divider class="padding-bottom-4x" style="width: 100px">
      </mat-divider>
      <app-auth-line-login-btn></app-auth-line-login-btn>
    </section> -->
</form>
